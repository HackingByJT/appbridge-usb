name: Build Windows beta

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Obtain pinned portable NSIS compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'appbridge-packaging'
          New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
          $archivePath = Join-Path $toolDirectory 'nsis-3.13.zip'
          curl.exe --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 --output $archivePath 'https://netactuate.dl.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compiler download failed.' }
          $expectedHash = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'NSIS archive SHA-256 did not match the pinned upstream hash.'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolDirectory
          $compilerPath = Join-Path $toolDirectory 'nsis-3.13\makensis.exe'
          "APPBRIDGE_MAKENSIS=$compilerPath" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile and package
        run: .\scripts\package.ps1

      - name: Retain build artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AppBridgeUSB-0.1.0-beta-win64
          path: |
            dist/AppBridgeUSB-0.1.0-beta-win64-setup.exe
            dist/AppBridgeUSB-0.1.0-beta-win64-portable.zip
            dist/AppBridgeUSB-0.1.0-beta-win64-payload.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
